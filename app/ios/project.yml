name: BlueFish
options:
  bundleIdPrefix: com.carltian
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  BlueFish:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carltian.bluefish
        PRODUCT_NAME: BlueFish
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
