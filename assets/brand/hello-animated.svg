<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="840" height="240" fill="none" role="img" aria-label="Hello Games Studio animated logo">
  <title>Hello Games Studio — The Open Hello（动态版）</title>
  <style>
    .node { transform-origin: 60px 60px; }
    .ring { opacity: 0; }
    .txt  { opacity: 0; }
  </style>
  <g transform="translate(0,10) scale(0.8333)">
    <!-- 阶段 1（0–620ms）：描线 -->
    <path d="M98.042 47.639 A40 40 0 1 1 72.361 21.958" stroke="currentColor" stroke-width="7" fill="none"
          stroke-dasharray="213.628" stroke-dashoffset="213.628">
      <animate attributeName="stroke-dashoffset" from="213.628" to="0"
               begin="0s" dur="0.62s" fill="freeze" calcMode="spline"
               keySplines="0.65 0 0.35 1" keyTimes="0;1"/>
    </path>
    <!-- 阶段 2（620–1100ms）：内环分段形成 -->
    <circle class="ring" cx="60" cy="60" r="17.5" stroke="currentColor"
            stroke-width="1.7" fill="none">
      <animate attributeName="opacity" from="0" to="0.34" begin="0.62s" dur="0.48s" fill="freeze"/>
      <animateTransform attributeName="transform" type="rotate" from="-24 60 60" to="0 60 60"
                        begin="0.62s" dur="0.48s" fill="freeze" calcMode="spline"
                        keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
    </circle>
    <!-- 阶段 3（1100–1500ms）：中心节点酸橙绿高光 -->
    <circle class="node" cx="60" cy="60" r="0" fill="#C7FF52">
      <animate attributeName="r" from="0" to="10.5" begin="1.1s" dur="0.28s" fill="freeze"
               calcMode="spline" keySplines="0.25 1 0.35 1" keyTimes="0;1"/>
      <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.18s" fill="freeze"/>
    </circle>
  </g>
  <!-- 阶段 4（1500–1800ms）：名称位移显现，末帧与静态 lockup 坐标一致 -->
  <g class="txt">
    <text x="116" y="76" class="wm" font-family="Inter, Inter var, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="54" font-weight="600" letter-spacing="-0.02em" text-anchor="start" fill="currentColor">Hello</text>
    <text x="120" y="100" font-family="Inter, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0.34em" text-anchor="start" fill="currentColor" opacity="0.6">GAMES STUDIO</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-14 0" to="0 0"
                      begin="1.5s" dur="0.3s" fill="freeze" calcMode="spline"
                      keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
  </g>
</svg>
