<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 120" width="940" height="240" fill="none" role="img" aria-label="Byebye Games Engine animated logo">
  <title>Byebye Games Engine v1.0 — The Passing Gate（动态版）</title>
  <g transform="translate(0,6) scale(0.8333)">
    <!-- 阶段 1（0–420ms）：两侧进入 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.42s" fill="freeze"/>
      <g class="back">
        <animateTransform attributeName="transform" type="translate" from="-26 0" to="0 0"
                          begin="0s" dur="0.42s" fill="freeze" calcMode="spline"
                          keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
        <g class="front">
          <animateTransform attributeName="transform" type="translate" from="26 0" to="0 0"
                            begin="0s" dur="0.42s" fill="freeze" calcMode="spline"
                            keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
          <path d="M26 79 L26 28 A9 9 0 0 1 35 19 L55 19 A9 9 0 0 1 64 28 L64 79" fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="butt" stroke-linejoin="round"/>
          <path d="M56 101 L56 50 A9 9 0 0 1 65 41 L85 41 A9 9 0 0 1 94 50 L94 101" fill="none" stroke="currentColor" stroke-width="6.2" stroke-linecap="butt" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
    <!-- 阶段 5（940–1240ms）：对齐（两门框微调至最终坐标） -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.94s" dur="0.1s" fill="freeze"/>
      <path d="M26 79 L26 28 A9 9 0 0 1 35 19 L55 19 A9 9 0 0 1 64 28 L64 79" fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="butt" stroke-linejoin="round"/>
      <path d="M56 101 L56 50 A9 9 0 0 1 65 41 L85 41 A9 9 0 0 1 94 50 L94 101" fill="none" stroke="currentColor" stroke-width="6.2" stroke-linecap="butt" stroke-linejoin="round"/>
    </g>
    <!-- 阶段 4（700–940ms）：绿光扫过门缝 -->
    <rect x="39.6" y="60" width="2.8" height="0" rx="1.4" fill="#C7FF52" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.12s" fill="freeze"/>
      <animate attributeName="height" from="0" to="30" begin="0.7s" dur="0.24s" fill="freeze" calcMode="spline" keySplines="0.22 0.61 0.36 1" keyTimes="0;1"/>
      <animate attributeName="opacity" from="1" to="0.9" begin="1.18s" dur="0.2s" fill="freeze"/>
    </rect>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.24s" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-12 0" to="0 0"
                      begin="1.24s" dur="0.3s" fill="freeze" calcMode="spline"
                      keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
    <text x="116" y="68" class="wm" font-family="Inter, Inter var, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="48" font-weight="600" letter-spacing="-0.015em" text-anchor="start" fill="currentColor">Byebye</text>
    <text x="120" y="92" font-family="Inter, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="0.3em" text-anchor="start" fill="currentColor" opacity="0.6">GAMES ENGINE  v1.0</text>
  </g>
  <!-- 阶段 6（1720–1960ms）：入口打开 —— 门缝绿光扩散后收束 -->
  <rect x="33.365" y="30" width="1.6" height="0" rx="0.8" fill="#C7FF52" opacity="0">
    <animate attributeName="height" from="0" to="46" begin="1.72s" dur="0.14s" fill="freeze"/>
    <animate attributeName="opacity" from="0.9" to="0" begin="1.72s" dur="0.24s" fill="freeze"/>
  </rect>
</svg>
